name: Trusted CI

on:
  push:
    branches: [main, "codex/**", "fix/**", "feat/**", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","ci-vps"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci --prefer-offline --no-audit
      - run: npm run lint
      - run: npm run build
